[Unit]
After=network-online.target time-sync.target systemd-time-wait-sync.service reiven-ephemeral-guard.service
Wants=network-online.target time-sync.target systemd-time-wait-sync.service
Requires=reiven-ephemeral-guard.service

[Service]
Environment=XDG_DATA_HOME=/run/caddy-data
Environment=XDG_CONFIG_HOME=/run/caddy-config
ReadWritePaths=/run/caddy-data /run/caddy-config
